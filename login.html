<div class="flex min-h-[70vh] items-center justify-center">
  <div class="w-full max-w-md rounded-lg border border-slate-200 bg-white p-6 shadow-lg">
    <!-- Título do sistema -->
    <div class="mb-6 text-center">
      <h1 class="text-3xl font-bold tracking-tight text-slate-900">
        Sistema<span class="text-indigo-600">RH</span>
      </h1>
      <p class="mt-1 text-sm text-slate-500">Acesse sua conta para continuar</p>
    </div>

    <!-- Formulário (sem lógica por enquanto: o preventDefault evita o recarregamento da página) -->
    <form class="space-y-4" [formGroup]="form" (ngSubmit)="entrar()">
      <div>
        <label for="email" class="mb-1 block text-sm font-medium text-slate-700">E-mail</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          placeholder="seu.email@empresa.com"
          required
          formControlName="email"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-900 placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none"
        />
      </div>

      <div>
        <label for="senha" class="mb-1 block text-sm font-medium text-slate-700">Senha</label>
        <input
          id="senha"
          name="senha"
          type="password"
          autocomplete="current-password"
          placeholder="••••••••"
          required
          formControlName="senha"
          class="w-full rounded-md border border-slate-300 px-3 py-2 text-slate-900 placeholder:text-slate-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none"
        />
      </div>

      @if (erro()) {
        <p class="rounded-md bg-red-50 px-3 py-2 text-sm text-red-700">{{ erro() }}</p>
      }

      <button
        type="submit"
        [disabled]="carregando()"
        class="... disabled:cursor-not-allowed disabled:opacity-60"
      >
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <!-- Link para cadastro -->
    <p class="mt-6 text-center text-sm text-slate-600">
      Não possui uma conta?
      <a routerLink="/cadastro" class="font-medium text-indigo-600 hover:text-indigo-800 hover:underline">
        Cadastre-se
      </a>
    </p>
  </div>
</div>
