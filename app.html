<div class="flex min-h-screen flex-col bg-slate-100">
  <!-- Menu principal -->
  <header class="bg-slate-900 shadow-md">
    <nav
      class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-4 px-4 py-3"
      aria-label="Menu principal"
    >
      <a routerLink="/lista-funcionarios" class="text-xl font-bold tracking-tight text-white">
        Sistema<span class="text-indigo-400">RH</span>
      </a>

      <!-- Links de funcionalidades -->
      <ul class="flex flex-wrap items-center gap-1 text-slate-300">
        <li>
          <a
            routerLink="/lista-funcionarios"
            routerLinkActive="bg-indigo-600 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-white"
          >
            Funcionários
          </a>
        </li>
        <li>
          <a
            routerLink="/formulario-funcionarios"
            routerLinkActive="bg-indigo-600 text-white"
            [routerLinkActiveOptions]="{ exact: true }"
            ariaCurrentWhenActive="page"
            class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-white"
          >
            Novo funcionário
          </a>
        </li>
        <li>
          <a
            routerLink="/enderecos"
            routerLinkActive="bg-indigo-600 text-white"
            ariaCurrentWhenActive="page"
            class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-white"
          >
            Endereços
          </a>
        </li>
        <li>
          <a
            routerLink="/contatos"
            routerLinkActive="bg-indigo-600 text-white"
            ariaCurrentWhenActive="page"
            class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-white"
          >
            Contatos
          </a>
        </li>
      </ul>

      <!-- Links de acesso -->
      <ul class="flex items-center gap-1 text-slate-300">
        <li>
          <a
            routerLink="/login"
            routerLinkActive="bg-indigo-600 text-white"
            ariaCurrentWhenActive="page"
            class="block rounded-md px-3 py-2 text-sm font-medium transition-colors hover:text-white"
          >
            Login
          </a>
        </li>
        <li>
          <a
            routerLink="/cadastro"
            routerLinkActive="bg-indigo-600 text-white"
            ariaCurrentWhenActive="page"
            class="block rounded-md border border-slate-600 px-3 py-2 text-sm font-medium transition-colors hover:text-white"
          >
            Cadastro
          </a>
        </li>
      </ul>
      @if (auth.estaLogado()) {
        <button (click)="auth.logout()"
          class="rounded-md px-3 py-2 text-sm font-medium text-slate-300 hover:text-white">
          Sair
        </button>
      }
    </nav>
  </header>

  <!-- Área onde o Angular renderiza o componente da rota ativa -->
  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-6">
    <section class="rounded-lg bg-white p-6 shadow-sm">
      <router-outlet />
    </section>
  </main>
</div>
